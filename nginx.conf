# Nginx 反向代理配置
#
# 使用方式（Ubuntu）:
#   sudo cp nginx.conf /etc/nginx/sites-available/ai-resume
#   sudo ln -s /etc/nginx/sites-available/ai-resume /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default   # 可选，移除默认站点
#   sudo nginx -t && sudo systemctl reload nginx
#
# 获取 SSL 证书（有域名后）:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com

# ─── 速率限制定义 ───
# 每个 IP 每秒最多 10 个请求，突发 20 个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 连接数限制：每个 IP 最多 20 个并发连接
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    # 没有域名时监听 80 端口，server_name 用 IP 或 _
    listen 80 default_server;
    server_name _;

    # 客户端请求体大小限制
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # 超时设置（AI 接口耗时较长）
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # 安全头（配合 Helmet 双重保障）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 隐藏 Nginx 版本号
    server_tokens off;

    # ─── 静态资源（上传文件） ───
    location /uploads/ {
        alias /opt/ai-resume/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── API 反向代理 ───
    location / {
        # 速率限制
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 转发真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓存（API 响应）
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ─── 健康检查端点无需限流 ───
    location /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
